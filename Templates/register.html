<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | Billsync</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='Version3/logo/snapedit.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='Version3/logo/snapedit.ico') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='Version3/css/auth.css') }}">
</head>
<body>
  <div class="auth-form">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash-message {{ category }}">{{ message }}</div>
      {% if category == 'success' %}
        <script>
          setTimeout(() => {
            window.location.href = "{{ url_for('auth.login') }}";
          }, 10000);
        </script>
      {% endif %}
    {% endfor %}
  {% endwith %}  
    <h2>Sign Up</h2>
    <form action="{{ url_for('auth.register') }}" method="POST" onsubmit="return validatePassword()">
      <div class="input-group">
        <label for="username">Full Name</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="signup-email" name="email" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="signup-password" name="password" required>
        <span class="toggle-password" onclick="togglePassword('signup-password')">👁</span>
      </div>
      <div class="input-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
        <span class="toggle-password" onclick="togglePassword('confirm-password')">👁</span>
      </div>
      <p id="password-error" style="color: red; display: none;">Passwords do not match!</p>
      <button type="submit" class="auth-btn">Sign Up</button>
    </form>
    <p class="switch-auth">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div>
  <img src="{{ url_for('static', filename='Version3/image/undraw_financial-data_r0vs.svg') }}" alt="Login Illustration" class="auth-illustration">
  <script src="{{ url_for('static', filename='Version3/js/auth.js') }}"></script>
</body>
</html>
