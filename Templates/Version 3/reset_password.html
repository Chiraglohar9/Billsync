<!DOCTYPE html>
<html lang="en">
<head>
  <title>Reset Password | Billsync</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='Version3/css/forpassword.css') }}">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='Version3/logo/snapedit.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='Version3/logo/snapedit.ico') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LdphvMqAAAAAHT0RH58lRbJI4NlYFHsRDaxY14E"></script>
</head>
<body>
  <div class="auth-form">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash-message flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %} 
    <h2>Reset Password</h2>
    <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
      <div class="input-group">
        <label for="username">New Password:</label>
        <input type="password" id="password" name="password" required>
        <span class="toggle-password" onclick="togglePassword('password')">👁</span>
      </div>
      <div class="input-group">
        <label for="password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
        <span class="toggle-password" onclick="togglePassword('confirm_password')">👁</span>
      </div>
      <div class="g-recaptcha" data-sitekey="6LdphvMqAAAAAHT0RH58lRbJI4NlYFHsRDaxY14E" data-callback="onsubmit" data-action="onclick"></div>
      <br>
      <button type="submit" class="auth-btn" action>Reset Password</button>
    </form>
    <p class="switch-auth"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
</div>
  <img src="{{ url_for('static', filename='Version3/image/undraw_projections_fhch.svg') }}" alt="Login Illustration" class="auth-illustration">
  <script src="{{ url_for('static', filename='Version3/js/auth.js') }}"></script>
</body>
</html>
