<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login | Billsync</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='Version3/css/auth.css') }}">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='Version3/logo/snapedit.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='Version3/logo/snapedit.ico') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LdphvMqAAAAAHT0RH58lRbJI4NlYFHsRDaxY14E"></script>
</head>
<body>
  <div class="auth-form">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash-message flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %} 
    <h2>Login</h2>
    <form action="{{ url_for('auth.login') }}" method="POST" onsubmit="return saveLogin();">
      <div class="input-group">
        <label for="username">Email</label>
        <input type="text" id="login-email" name="username" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="login-password" name="password" required>
        <span class="toggle-password" onclick="togglePassword('login-password')">👁</span>
      </div>
      <div class="options">
        <label class="remember-me">
          <input type="checkbox" id="remember-me"> Remember Me
        </label>
        <a href="{{ url_for('auth.forgot_password') }}"class="forgot-password">Forgot Password?</a>
      </div>
      <div class="g-recaptcha" data-sitekey="6LdphvMqAAAAAHT0RH58lRbJI4NlYFHsRDaxY14E" data-callback="onsubmit" data-action="onclick"></div>
      <br>
      <button type="submit" class="auth-btn" action>Login</button>
    </form>
    <p class="switch-auth">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
  </div>
  <img src="{{ url_for('static', filename='Version3/image/undraw_projections_fhch.svg') }}" alt="Login Illustration" class="auth-illustration">
  <script src="{{ url_for('static', filename='Version3/js/auth.js') }}"></script>
</body>
</html>
